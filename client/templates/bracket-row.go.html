{{ define "bracket-row" }}

<tr>
  <td>{{ .Title }}</td>
  <td data-sort="{{ unix .ActiveFrom }}">
    {{ .ActiveFrom }} - {{ .ActiveUntil }}
  </td>
  <td>
    {{ range .BracketTypes }}
    <a class="btn {{ bracketColor . }}" href="/scores/{{ $.ActiveFrom}}/{{ . }}"
      >{{ capitalize . }}</a
    >
    {{ end }}
  </td>
</tr>

{{ end }}
